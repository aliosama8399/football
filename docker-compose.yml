# ══════════════════════════════════════════════════════════════════════════
# Football Analysis — full deployment stack
#
# SERVICES
#   fastapi   → the REST/GraphQL API  (this repo, Dockerfile, GPU build)  :8001
#   bento     → Unified BentoML + FastAPI service (GPU build, default)    :8001
#   postgres  → relational DB + default KG provider                       :5432
#   neo4j     → alternative KG provider (graph DB)                  :7474 / :7687
#   (vector)  → FAISS is EMBEDDED (in-process, file-based) or pgvector in Postgres.
#
# NOTE: All code & model folders are bind-mounted as volumes into the containers.
# Once `football-fastapi:latest` is built once, NEVER pass `--build` to
# `docker compose up -d` — changes take effect immediately via volume mounts!
# ══════════════════════════════════════════════════════════════════════════

services:

  # ── 1. FASTAPI APP (GPU) — Standalone (Optional Profile) ──────────────────
  fastapi:
    image: football-fastapi:latest
    pull_policy: never
    build:
      context: .
      args:
        GPU: "1"
    profiles: ["fastapi-standalone"]
    container_name: football-api
    gpus: all # requires nvidia-container-toolkit
    environment:
      POSTGRES_DSN: postgresql://postgres:123@postgres:5432/football_rag
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      FOOTBALL_ONNX_MODEL_PATH: /app/models/export/slm_gpu
      HF_HUB_OFFLINE: "0"
      VLLM_API_URL: http://vllm:8000/v1
      MLFLOW_TRACKING_URI: http://mlflow:5000
      OLLAMA_HOST: http://host.docker.internal:11434
      KG_PROVIDER: neo4j
      VECTOR_PROVIDER: pgvector
      AUTO_SCHEDULER_ENABLED: "true"
      AUTO_SCHEDULER_INTERVAL_HOURS: "24"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/usr/bin/tini", "--", "/bin/bash", "-c", "sed 's/\\r$//' /app/entrypoint.sh | /bin/bash -s -- \"$@\"", "--"]
    volumes:
      - ./entrypoint.sh:/app/entrypoint.sh:ro
      - ./models:/app/models
      - ./rag:/app/rag
      - ./api:/app/api
      - ./monitoring:/app/monitoring
      - ./serving:/app/serving
      - ./data:/app/data
      - ./eval:/app/eval
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    restart: unless-stopped

  # ── 1b. UNIFIED BENTOML APP & GNN ADAPTIVE BATCHING (Primary Service) ────
  bento:
    image: football-fastapi:latest
    pull_policy: never
    build:
      context: .
      args:
        GPU: "1"
    container_name: football-bento
    gpus: all # requires nvidia-container-toolkit for CUDAExecutionProvider & PyG GNN
    ports:
      - "8001:8001"
    environment:
      POSTGRES_DSN: postgresql://postgres:123@postgres:5432/football_rag
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      FOOTBALL_ONNX_MODEL_PATH: /app/models/export/slm_gpu
      HF_HUB_OFFLINE: "0"
      VLLM_API_URL: http://vllm:8000/v1
      MLFLOW_TRACKING_URI: http://mlflow:5000
      OLLAMA_HOST: http://host.docker.internal:11434
      KG_PROVIDER: neo4j
      VECTOR_PROVIDER: pgvector
      AUTO_SCHEDULER_ENABLED: "true"
      AUTO_SCHEDULER_INTERVAL_HOURS: "24"
      PYTHONUNBUFFERED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/usr/bin/tini", "--", "/bin/bash", "-c", "sed 's/\\r$//' /app/entrypoint.sh | /bin/bash -s -- \"$@\"", "--"]
    volumes:
      - ./entrypoint.sh:/app/entrypoint.sh:ro
      - ./models:/app/models
      - ./rag:/app/rag
      - ./api:/app/api
      - ./monitoring:/app/monitoring
      - ./serving:/app/serving
      - ./data:/app/data
      - ./eval:/app/eval
      - ./mlruns:/app/mlruns
    command: ["bentoml", "serve", "serving.bentoml.service:FootballBentoService", "--host", "0.0.0.0", "--port", "8001"]
    networks:
      default:
        aliases:
          - fastapi
          - bento
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    restart: unless-stopped

  # ── 1c. AUTOMATED SCRAPER & CONTINUOUS EVALUATION RUNNER (GPU Worker) ────
  auto-eval:
    image: football-fastapi:latest
    pull_policy: never
    container_name: football-auto-eval
    gpus: all # NVIDIA GPU acceleration for GNN training & Ollama inference
    environment:
      POSTGRES_DSN: postgresql://postgres:123@postgres:5432/football_rag
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      API_URL: http://fastapi:8001
      MLFLOW_TRACKING_URI: http://mlflow:5000
      OLLAMA_HOST: http://host.docker.internal:11434
      KG_PROVIDER: neo4j
      VECTOR_PROVIDER: pgvector
      USE_TF: "0"
      USE_TORCH: "1"
      TF_ENABLE_ONEDNN_OPTS: "0"
      PYTHONUNBUFFERED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/usr/bin/tini", "--"]
    volumes:
      - ./data:/app/data
      - ./eval:/app/eval
      - ./monitoring:/app/monitoring
      - ./models:/app/models
      - ./rag:/app/rag
      - ./mlruns:/app/mlruns
    command: ["python", "data/auto_scrape_and_eval.py", "--interval-hours", "24", "--judge", "heuristic"]
    healthcheck:
      disable: true
    depends_on:
      bento:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── 2. POSTGRESQL + PGVECTOR (relational + vector provider) ──────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: football-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: football_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d football_rag" ]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── 3. NEO4J (alternative KG graph provider) ──────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: football-neo4j
    environment:
      NEO4J_AUTH: neo4j/password # matches llm_config.yaml defaults
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 512M
    ports:
      - "7474:7474" # HTTP browser console
      - "7687:7687" # Bolt
    volumes:
      - neo4jdata:/data

  # ── 4. MLFLOW experiment tracking server ──────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.0
    container_name: football-mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow_store/mlflow.db --artifacts-destination /mlflow_store/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_store:/mlflow_store
    restart: unless-stopped

  # ── TENSORRT-LLM / vLLM sidecar (OpenAI-compatible) ───────────────────────
  vllm:
    image: vllm/vllm-openai:latest
    profiles: [ "vllm" ]
    container_name: football-vllm
    gpus: all
    shm_size: 8g
    ports:
      - "8356:8000" # OpenAI API on host port 8356
    environment:
      HF_HOME: /hf
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_LOGGING_LEVEL: INFO
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
    command:
      - --model
      - aliosama8399/football-analysisN
      - --enforce-eager
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "2048"
      - --gpu-memory-utilization
      - "0.60"
      - --dtype
      - half

    volumes:
      - hf_cache:/hf
    restart: "no"

  # ── 5. PROMETHEUS (Metrics Scraper & Time-Series DB) ──────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: football-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    restart: unless-stopped

  # ── 6. GRAFANA (Real-Time RAGAS & MLOps Dashboard) ────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: football-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ── 7. APACHE AIRFLOW (Orchestrator - Optional Profile) ───────────────────
  airflow-webserver:
    image: apache/airflow:2.10.2
    profiles: ["airflow"]
    container_name: football-airflow-webserver
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:123@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__LAZY_LOAD_PLUGINS: 'true'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      AIRFLOW__WEBSERVER__SECRET_KEY: 'football_secret_key_airflow_2026'
      AIRFLOW__WEBSERVER__WORKERS: '4'
      AIRFLOW__WEBSERVER__WORKER_TIMEOUT: '120'
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: '120'
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: '120'
      AIRFLOW__WEBSERVER__PAGE_SIZE: '25'
      AIRFLOW__WEBSERVER__AUTO_REFRESH_INTERVAL: '15'
      AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: '10'
      AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: '20'
      PROJECT_ROOT: /workspace
    volumes:
      - ./data/dags:/opt/airflow/dags
    ports:
      - "8080:8080"
    command:
      - bash
      - -c
      - |
        rm -f /opt/airflow/airflow-webserver.pid
        if ! python -c "import psycopg2; c=psycopg2.connect('postgresql://postgres:123@postgres:5432/postgres'); c.autocommit=True; cur=c.cursor(); cur.execute('''SELECT 1 FROM pg_database WHERE datname='airflow' '''); cur.fetchone() or cur.execute('CREATE DATABASE airflow'); c.close(); c2=psycopg2.connect('postgresql://postgres:123@postgres:5432/airflow'); cur2=c2.cursor(); cur2.execute('''SELECT 1 FROM ab_user WHERE username='admin' '''); assert cur2.fetchone()" 2>/dev/null; then
          airflow db migrate
          airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@football.com || true
        fi
        exec airflow webserver

  airflow-scheduler:
    image: apache/airflow:2.10.2
    profiles: ["airflow"]
    container_name: football-airflow-scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:123@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__LAZY_LOAD_PLUGINS: 'true'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      AIRFLOW__WEBSERVER__SECRET_KEY: 'football_secret_key_airflow_2026'
      AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: '10'
      AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: '20'
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      KG_PROVIDER: neo4j
      POSTGRES_DSN: postgresql://postgres:123@postgres:5432/football_rag
      VECTOR_PROVIDER: pgvector
      API_URL: http://fastapi:8001
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PROJECT_ROOT: /workspace
    volumes:
      - ./data/dags:/opt/airflow/dags
      - ./data:/workspace/data
      - ./eval:/workspace/eval
      - ./rag:/workspace/rag
      - ./models:/workspace/models
      - ./monitoring:/workspace/monitoring
      - ./mlruns:/workspace/mlruns
    command:
      - bash
      - -c
      - |
        sleep 3
        if ! python -c "import psycopg2; c=psycopg2.connect('postgresql://postgres:123@postgres:5432/airflow'); cur=c.cursor(); cur.execute('''SELECT 1 FROM ab_user WHERE username='admin' '''); assert cur.fetchone()" 2>/dev/null; then
          airflow db migrate
        fi
        exec airflow scheduler

volumes:
  pgdata:
  neo4jdata:
  mlflow_store:
  hf_cache:
  prom_data:
  grafana_data:
