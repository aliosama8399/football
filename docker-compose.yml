# ══════════════════════════════════════════════════════════════════════════
# Football Analysis — full deployment stack
#
# SERVICES
#   fastapi   → the REST/GraphQL API  (this repo, Dockerfile, GPU build)  :8001
#   postgres  → relational DB + default KG provider                       :5432
#   neo4j     → alternative KG provider (graph DB)                  :7474 / :7687
#   (vector)  → FAISS is EMBEDDED (in-process, file-based) — no server
#               container. The index lives in ./rag/vector_store and is
#               mounted read-only into the fastapi container below.
#
# GPU: the fastapi service requests all NVIDIA GPUs (nvidia-container-toolkit
# required on the host). The image is built with --build-arg GPU=1 and loads
# onnxruntime-gpu + onnxruntime-genai-cuda; the SLM artifact must be the CUDA
# one (models/export/slm_gpu, built with -e cuda — see README Stage 5b).
#
#   kg/vector selection lives in models/llm_config.yaml:
#     rag.kg_provider: postgres | neo4j      rag.vector_provider: faiss
# ══════════════════════════════════════════════════════════════════════════

services:

  # ── 1. FASTAPI APP (GPU) — Standalone (Optional Profile) ──────────────────
  fastapi:
    build:
      context: .
      args:
        GPU: "1"
    profiles: ["fastapi-standalone"]
    container_name: football-api
    gpus: all # requires nvidia-container-toolkit
    environment:
      POSTGRES_DSN: postgresql://postgres:123@postgres:5432/football_rag
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      # CUDA artifact built with `-e cuda` (README Stage 5b)
      FOOTBALL_ONNX_MODEL_PATH: /app/models/export/slm_gpu
      HF_HUB_OFFLINE: "0"
      # Inside the compose network, vllm is reached by SERVICE NAME (not localhost)
      VLLM_API_URL: http://vllm:8000/v1
      KG_PROVIDER: neo4j
      VECTOR_PROVIDER: pgvector
    volumes:
      - ./models:/app/models
      - ./rag:/app/rag
      - ./api:/app/api
      - ./monitoring:/app/monitoring
      - ./serving:/app/serving
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    restart: unless-stopped

  # ── 1b. UNIFIED BENTOML APP & GNN ADAPTIVE BATCHING (Primary Service) ────
  bento:
    image: football-fastapi:latest
    container_name: football-bento
    ports:
      - "8001:8001"
    environment:
      POSTGRES_DSN: postgresql://postgres:123@postgres:5432/football_rag
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      FOOTBALL_ONNX_MODEL_PATH: /app/models/export/slm_gpu
      HF_HUB_OFFLINE: "0"
      VLLM_API_URL: http://vllm:8000/v1
      KG_PROVIDER: neo4j
      VECTOR_PROVIDER: pgvector
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./models:/app/models
      - ./rag:/app/rag
      - ./api:/app/api
      - ./monitoring:/app/monitoring
      - ./serving:/app/serving
      - ./data:/app/data
      - ./eval:/app/eval
    command: ["bentoml", "serve", "serving.bentoml.service:FootballBentoService", "--host", "0.0.0.0", "--port", "8001"]
    networks:
      default:
        aliases:
          - fastapi
          - bento
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    restart: unless-stopped

  # ── 1c. AUTOMATED SCRAPER & CONTINUOUS EVALUATION RUNNER ──────────────────
  auto-eval:
    image: football-fastapi:latest
    container_name: football-auto-eval
    environment:
      POSTGRES_DSN: postgresql://postgres:123@postgres:5432/football_rag
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      API_URL: http://fastapi:8001
      USE_TF: "0"
      USE_TORCH: "1"
      TF_ENABLE_ONEDNN_OPTS: "0"
    volumes:
      - ./data:/app/data
      - ./eval:/app/eval
      - ./monitoring:/app/monitoring
      - ./models:/app/models
      - ./rag:/app/rag
    command: ["python", "data/auto_scrape_and_eval.py", "--interval-hours", "24", "--judge", "heuristic"]
    depends_on:
      bento:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── 2. POSTGRESQL + PGVECTOR (relational + vector provider) ──────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: football-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: football_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d football_rag" ]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── 3. NEO4J (alternative KG graph provider) ──────────────────────────────
  # Populate with:  python rag/build_neo4j_kg.py   (host, against localhost:7687)
  # Switch provider: set rag.kg_provider: neo4j in models/llm_config.yaml
  neo4j:
    image: neo4j:5-community
    container_name: football-neo4j
    environment:
      NEO4J_AUTH: neo4j/password # matches llm_config.yaml defaults
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 512M
    ports:
      - "7474:7474" # HTTP browser console
      - "7687:7687" # Bolt
    volumes:
      - neo4jdata:/data

  # ── 4. MLFLOW experiment tracking server ──────────────────────────────────
  # Web UI at http://localhost:5000. Logs experiments, runs, and model registry.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.0
    container_name: football-mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow_store/mlflow.db --artifacts-destination /mlflow_store/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_store:/mlflow_store
    restart: unless-stopped

  # ── TENSORRT-LLM sidecar (OpenAI-compatible) ───────────────────────────
  # Pinned image (reproducibility ≠ :latest — build the engine against this
  # exact version). Start ONLY when needed:
  #     docker compose --profile trtllm up -d trtllm
  vllm:
    image: vllm/vllm-openai:latest
    profiles: [ "vllm" ]
    container_name: football-vllm
    gpus: all
    shm_size: 8g
    ports:
      - "8356:8000" # OpenAI API on host port 8356
    environment:
      HF_HOME: /hf
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_LOGGING_LEVEL: INFO
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
    command:
      - --model
      - aliosama8399/football-analysisN
      - --enforce-eager
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "2048"
      - --gpu-memory-utilization
      - "0.60"
      - --dtype
      - half

    volumes:
      # Model weights cached here so restarts do NOT re-download (~1.2 GB once)
      - hf_cache:/hf
    restart: unless-stopped

  # ── 5. PROMETHEUS (Metrics Scraper & Time-Series DB) ──────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: football-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    restart: unless-stopped

  # ── 6. GRAFANA (Real-Time RAGAS & MLOps Dashboard) ────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: football-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ── 7. APACHE AIRFLOW (Orchestrator - Optional Profile) ───────────────────
  # To start Airflow: docker compose --profile airflow up -d
  airflow-webserver:
    image: apache/airflow:2.10.2
    profiles: ["airflow"]
    container_name: football-airflow-webserver
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:123@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: 'football_secret_key_airflow_2026'
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      KG_PROVIDER: neo4j
      POSTGRES_DSN: postgresql://postgres:123@postgres:5432/football_rag
      VECTOR_PROVIDER: pgvector
      API_URL: http://fastapi:8001
      PYTHONPATH: /opt/airflow
    volumes:
      - ./data/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./eval:/opt/airflow/eval
      - ./rag:/opt/airflow/rag
      - ./models:/opt/airflow/models
      - ./monitoring:/opt/airflow/monitoring
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.10.2
    profiles: ["airflow"]
    container_name: football-airflow-scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:123@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      KG_PROVIDER: neo4j
      POSTGRES_DSN: postgresql://postgres:123@postgres:5432/football_rag
      VECTOR_PROVIDER: pgvector
      API_URL: http://fastapi:8001
      PYTHONPATH: /opt/airflow
    volumes:
      - ./data/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./eval:/opt/airflow/eval
      - ./rag:/opt/airflow/rag
      - ./models:/opt/airflow/models
      - ./monitoring:/opt/airflow/monitoring
    command: scheduler

volumes:
  pgdata:
  neo4jdata:
  mlflow_store:
  hf_cache:
  prom_data:
  grafana_data:

