[project]
name = "football-analysis"
version = "2.0.0"
description = "Football match prediction & tactical analysis (TEA-GNN + Qwen SLM, RAG, FastAPI)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # ── Web layer ────────────────────────────────────────────────────────────
    "fastapi==0.140.0",
    "uvicorn[standard]==0.51.0",
    "starlette==1.3.1",
    "python-multipart==0.0.32",
    "strawberry-graphql==0.323.2",
    "graphql-core==3.2.11",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "email-validator==2.3.0",

    # ── Persistence ──────────────────────────────────────────────────────────
    "SQLAlchemy==2.0.51",
    "asyncpg==0.31.0",
    "psycopg2-binary==2.9.12",
    "alembic==1.18.5",
    "neo4j==6.2.0",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.2",

    # ── Auth ─────────────────────────────────────────────────────────────────
    "python-jose==3.5.0",
    "passlib==1.7.4",
    "bcrypt==5.0.0",
    "ecdsa==0.19.2",

    # ── ML runtime (CPU inference) ───────────────────────────────────────────
    "torch==2.13.0",
    "torch-geometric==2.8.0.post1",
    "transformers==4.57.6",
    "tokenizers==0.22.2",
    "sentence-transformers==5.6.1",
    "huggingface_hub>=0.34.0,<1.0",
    "hf-xet==1.5.2",
    "safetensors==0.8.0",
    "optimum[onnx]==2.1.0",
    "onnx==1.22.0",
    "onnxruntime==1.29.0",
    "onnxruntime-genai==0.15.2",
    "scikit-learn==1.9.0",
    "faiss-cpu==1.14.3",
    "numpy==2.5.1",
    "scipy==1.18.0",
    "pandas==3.0.5",

    # ── Misc ─────────────────────────────────────────────────────────────────
    "requests==2.34.2",
    "httpx==0.28.1",
    "openai==1.68.2",
    "psutil==7.2.2",
    "typer==0.27.0",
    "rich==15.0.0",

    # ── Data/model versioning (DVC) ──────────────────────────────────────────
    "dvc==3.67.1",

    # ── Experiment tracking (MLflow) ─────────────────────────────────────────
    "mlflow==3.16.0",

    # ── Evaluation, RAG & MLOps (Phase 0-2) ──────────────────────────────────
    "pgvector>=0.3.0",
    "rank-bm25>=0.2.2",
    "langfuse>=2.50.0",
    "ragas>=0.2.0",
    "langchain-core>=0.3.0",

    # ── Code Quality, Linting & CI/CD ────────────────────────────────────────
    "ruff>=0.9.0",
    "pylint>=3.2.0",
    "flynt>=1.0.1",
    "flint>=0.0.2",
    "pytest>=8.0.0",
    "onnxscript>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pylint>=3.0.0",
    "flynt>=1.0.1",
    "flint>=0.0.2",
    "pytest>=8.0.0",
]
finetune = [
    "unsloth>=2026.11.0",
    "unsloth_zoo>=2026.11.0",
    "trl>=0.15.0",
    "peft>=0.14.0",
    "bitsandbytes>=0.45.0",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
]

[tool.uv]
package = false

# CPU-only torch wheels (avoids pulling ~2.5 GB CUDA runtime in Docker)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# ══════════════════════════════════════════════════════════════════════════════
# LINTER & CI/CD CONFIGURATION (Ruff, Pylint, Flynt / Flint)
# ══════════════════════════════════════════════════════════════════════════════

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".agent",
    ".conda",
    ".dvc",
    ".git",
    ".pytest_cache",
    ".venv",
    ".vscode",
    "__pycache__",
    "cache_dir",
    "catboost_info",
    "logs",
    "migrations",
    "mlruns",
    "models/LlamaFactory",
    "models/catboost_info",
    "models/export",
    "models/model_storage",
    "models/saved",
    "notebooks",
    "old",
    "*.ipynb",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = ["F821"]

[tool.pylint.main]
py-version = "3.12"
jobs = 1
ignore-paths = [
    "^\\.agent/.*$",
    "^\\.conda/.*$",
    "^\\.venv/.*$",
    "^models/LlamaFactory/.*$",
    "^mlruns/.*$",
    "^old/.*$",
    "^notebooks/.*$",
    "^migrations/.*$",
]

[tool.pylint.typecheck]
ignored-modules = [
    "airflow",
    "alembic",
    "asyncpg",
    "bentoml",
    "catboost",
    "datasets",
    "faiss",
    "fastapi",
    "httpx",
    "langchain_core",
    "langfuse",
    "lightgbm",
    "matplotlib",
    "mlflow",
    "neo4j",
    "numpy",
    "onnx",
    "onnxruntime",
    "onnxruntime_genai",
    "openai",
    "optimum",
    "optuna",
    "pandas",
    "passlib",
    "peft",
    "pgvector",
    "psycopg2",
    "pydantic",
    "pydantic_settings",
    "ragas",
    "rank_bm25",
    "scipy",
    "seaborn",
    "sentence_transformers",
    "sklearn",
    "sqlalchemy",
    "starlette",
    "strawberry",
    "torch",
    "torch_geometric",
    "transformers",
    "trl",
    "unsloth",
    "uvicorn",
    "xgboost",
]

[tool.pylint."messages control"]
disable = [
    "C",      # convention checks (handled by ruff)
    "R",      # refactoring/design complexity checks
    "W",      # stylistic warnings (handled by ruff)
    "E0401",  # import-error (optional/container-only deps in CI)
    "E0611",  # no-name-in-module
    "E1101",  # no-member (dynamic torch/pandas/sqlalchemy attributes)
    "E1102",  # not-callable (torch.tensor / dynamic callables)
    "E1120",  # no-value-for-parameter
    "E1121",  # too-many-function-args
    "E1123",  # unexpected-keyword-arg
    "E1136",  # unsubscriptable-object
]

[tool.flynt]
line-length = 120
aggressive = false
transform-concats = false
