[project]
name = "football-analysis"
version = "2.0.0"
description = "Football match prediction & tactical analysis (TEA-GNN + Qwen SLM, RAG, FastAPI)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # ── Web layer ────────────────────────────────────────────────────────────
    "fastapi==0.140.0",
    "uvicorn[standard]==0.51.0",
    "starlette==1.3.1",
    "python-multipart==0.0.32",
    "strawberry-graphql==0.323.2",
    "graphql-core==3.2.11",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "email-validator==2.3.0",

    # ── Persistence ──────────────────────────────────────────────────────────
    "SQLAlchemy==2.0.51",
    "asyncpg==0.31.0",
    "psycopg2-binary==2.9.12",
    "alembic==1.18.5",
    "neo4j==6.2.0",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.2",

    # ── Auth ─────────────────────────────────────────────────────────────────
    "python-jose==3.5.0",
    "passlib==1.7.4",
    "bcrypt==5.0.0",
    "ecdsa==0.19.2",

    # ── ML runtime (CPU inference) ───────────────────────────────────────────
    "torch==2.13.0",
    "torch-geometric==2.8.0.post1",
    "transformers==4.57.6",
    "tokenizers==0.22.2",
    "sentence-transformers==5.6.1",
    "huggingface_hub>=0.34.0,<1.0",
    "hf-xet==1.5.2",
    "safetensors==0.8.0",
    "optimum[onnx]==2.1.0",
    "onnx==1.22.0",
    "onnxruntime==1.29.0",
    "onnxruntime-genai==0.15.2",
    "scikit-learn==1.9.0",
    "faiss-cpu==1.14.3",
    "numpy==2.5.1",
    "scipy==1.18.0",
    "pandas==3.0.5",

    # ── Misc ─────────────────────────────────────────────────────────────────
    "requests==2.34.2",
    "httpx==0.28.1",
    "psutil==7.2.2",
    "typer==0.27.0",
    "rich==15.0.0",

    # ── Data/model versioning (DVC) ──────────────────────────────────────────
    "dvc==3.67.1",
]

[tool.uv]
package = false

# CPU-only torch wheels (avoids pulling ~2.5 GB CUDA runtime in Docker)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
