# ============================================================
#  LLM Provider Configuration
#  ============================================================
#  This is the ONLY file you need to edit when:
#    - Changing a model name
#    - Rotating an API key
#    - Adding a new provider
#    - Changing an API endpoint
#
#  API keys can be set here OR as environment variables.
#  Environment variables always take priority over values here.
#
#  Env var names follow the pattern: <PROVIDER>_API_KEY
#  e.g.  OPENAI_API_KEY, GEMINI_API_KEY, ANTHROPIC_API_KEY
# ============================================================

# ── Which provider to use by default ──────────────────────
# Choices: ollama | huggingface | onnx | gemini | anthropic
default_provider: onnx

# ── Provider-specific settings ────────────────────────────
providers:

  ollama:
    # No API key needed — Ollama runs locally
    api_url: "http://localhost:11434/api/chat"
    default_model: "gemma3:1b"
    timeout: 300
    # Other models you can drop in:
    #   llama3:8b | llama3:70b | mistral | phi3 | gemma2 | glm-4.6:cloud (retired 2026-06)
    #   Cloud models (glm-5.2:cloud, kimi-k3:cloud, ...) require `ollama login`.

  openai:
    api_key: ""           # SECRET — keep in .env (OPENAI_API_KEY), never commit here
    default_model: "gpt-5.4-mini"
    timeout: 60
    # Other models you can drop in:
    #   gpt-4o | gpt-4-turbo | gpt-3.5-turbo | o1-mini

  gemini:
    api_key: ""           # SECRET — keep in .env (GEMINI_API_KEY), never commit here
    default_model: "gemini-2.0-flash"
    timeout: 60
    # Other models you can drop in:
    #   gemini-2.0-pro | gemini-1.5-pro | gemini-1.5-flash

  anthropic:
    api_key: ""           # Leave empty → reads ANTHROPIC_API_KEY env var
    default_model: "claude-haiku-4-5-20251001"
    timeout: 60
    # Other models you can drop in:
    #   claude-opus-4-6 | claude-sonnet-4-6 | claude-haiku-4-5-20251001

  huggingface:
    # HuggingFace token — required if the repo is private
    # Leave empty to read from HUGGINGFACE_HUB_TOKEN env var instead
    hf_token:       ""
    # Fully merged fine-tuned football model (no LoRA adapter needed)
    model_id:       "aliosama8399/football-analysisN"
    max_new_tokens: 2048
    temperature:    0.7

  onnx:
    # onnxruntime-genai CUDA artifact (REAL-TIME: ~65 tok/s on GPU vs ~1 tok/s CPU)
    # Rebuild with:
    #   conda run -n football python -m onnxruntime_genai.models.builder ^
    #     -m aliosama8399/football-analysisN -o models/export/slm_gpu -p fp16 -e cuda
    # Provider auto-detects genai_config.json -> GPU KV-cache backend.
    model_path:     "models/export/slm_gpu"
    max_new_tokens: 2048
    temperature:    0.7

# ── LLM generation parameters ─────────────────────────────
generation:
  temperature: 0.7
  max_tokens: 2048

  # ── RAG System Configuration ──────────────────────────────
rag:
  # Which providers to use — switch by changing these values
  kg_provider:     postgres       # neo4j | postgres
  vector_provider: faiss       # faiss
  # LLM used by the RAG module (chat + /kb/ask narration).
  #   openai | gemini | ollama | onnx | none (disabled)
  # onnx is the ONNX export of the finetuned SLM (replaces huggingface for inference)
  llm_provider:    onnx

  # GNN "Expert 1" prediction model — now ONNX (replaces torch checkpoint)
  # Export: conda run -n football python models/export_gnn.py
  gnn_model_path: "models/export/gnn/tea_gnn.onnx"

  # ── Neo4j ──────────────────────────────────────────────
  neo4j_uri:      "bolt://localhost:7687"
  neo4j_user:     "neo4j"
  neo4j_password: "password"   # Change to your Neo4j password

  # ── PostgreSQL ─────────────────────────────────────────
  # Format: postgresql://<user>:<password>@<host>:<port>/<dbname>
  postgres_dsn: "postgresql://postgres:123@localhost:5432/football_rag"

  # ── FAISS ──────────────────────────────────────────────
  faiss_index_path:    "rag/vector_store/faiss.index"
  faiss_metadata_path: "rag/vector_store/faiss_metadata.json"
  embed_model:         "sentence-transformers/all-MiniLM-L6-v2"
  faiss_nprobe:        16    # IVFFlat cells searched per query (higher = better filtered recall)

  # ── Knowledge base (chat / /kb endpoints) ──────────────
  # Structured facts come from the processed match CSV; team info/stats come
  # from PostgreSQL (TeamGraphRepository) with a CSV+tactics fallback.
  kb_csv_path:        "data/processed/processed_matches.csv"
  kb_tactics_path:    "rag/knowledge_base/team_tactics.json"
  kb_index_analyses:  false        # index tactical analyses JSONL into FAISS (semantic enrichment; run rag/build_faiss_index.py after enabling)
  kb_team_cache_ttl:  300          # seconds a team profile stays cached (per team, in-process)
  kb_csv_fallback:    true         # answer from CSV aggregates if PostgreSQL is unavailable

  # ── Retrieval settings ─────────────────────────────────
  vector_top_k:    5    # Number of FAISS results per query
  kg_form_matches: 5    # Number of recent matches to retrieve per team
